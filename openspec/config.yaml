schema: spec-driven

context: |
  Proyecto académico: sistema web de reservas de espacios académicos.
  Todos los artefactos deben redactarse en español.
  Tecnología: Django/Python, plantillas HTML/CSS y SQLite para desarrollo local.
  El sistema gestiona usuarios, espacios, disponibilidad, reservas, revisión, cancelación e historial.
  Debe impedir reservas solapadas para el mismo espacio.
  El límite máximo de cuatro horas se gestiona como cambio formal posterior a la implementación inicial.
  No implementar cambios nuevos hasta revisar propuesta, especificaciones, diseño y tareas.
  La documentación principal del proyecto es PLAN_INGENIERIA.md.
