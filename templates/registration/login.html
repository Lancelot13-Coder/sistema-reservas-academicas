{% extends "base.html" %}{% block title %}Iniciar sesión{% endblock %}{% block content %}<div class="card" style="max-width:480px;margin:3rem auto"><h1>Iniciar sesión</h1><p class="muted">Ingresa con la cuenta creada por el administrador del sistema.</p><form method="post">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}{% endfor %}<input type="hidden" name="next" value="{{ next }}"><p><button type="submit">Ingresar</button></p></form></div>{% endblock %}
